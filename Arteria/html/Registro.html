<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/registro.css">
    <title>Registro</title>
</head>
<body>
    
    <div class="formulario">
    
      <div class="cerrar">
        <a href="index.html">&times;</a>
      </div>
      
        <h2>Bienvenidos a Arteria</h2>
      
        <form>
          <input type="text" placeholder="Nombre" required>
          <input type="text" placeholder="Apellido" required>
          <input type="email" placeholder="Correo Electrónico" required>
          <input type="password" placeholder="Contraseña" required>
      
          <p class="nota-contra">
            La contraseña distingue mayúsculas y minúsculas
          </p>
      
          <button type="submit" class="boton-enviar">Registrarse</button>
      
          <p class="info">
            Recibe actualizaciones, promos y más cosas.  
            <br><br>
            Al registrarte aceptas <a href="./terminos_servicio.html">términos</a> y <a href="#">privacidad</a>.
          </p>
      
          <p class="ya-tiene-cuenta">
            ¿Ya tienes cuenta? <a href="./inicio_sesion.html">Inicia sesión</a>
          </p>
        </form>
      </div>
      
</body>
</html>
