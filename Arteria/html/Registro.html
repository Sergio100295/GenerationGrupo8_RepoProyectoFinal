    <div class="formulario">
    
        <button class="cerrar">&times;</button>
      
        <h2>Bienvenidos a Arteria</h2>
      
        <form>

          <button type="submit" class="boton-enviar">Registrarse</button>
      
          <p class="info">
            Recibe actualizaciones, promos y más cosas.  
            <br><br>
            Al registrarte aceptas <a href="#">términos</a> y <a href="#">privacidad</a>.

          </p>
