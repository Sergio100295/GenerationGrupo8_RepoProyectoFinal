<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículos Destacados - E-commerce Deportivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/indexcategorias.css">
</head>
<body>

  <div class="featured-section-wrapper">
    <div class="featured-section-background"></div>
    <div class="container my-5 position-relative" style="z-index: 2;">
        <h2 class="section-title">Artículos Destacados</h2>
      <div class="row">
        
        <div class="col-md-4 mb-4 d-flex">
          <div class="card h-100" onclick="window.location.href='#colecciones'">
            <img src="../img/obras_Inicio/obra_inicio_colecciones.png" class="card-img-top" alt="Nuevas Colecciones">
            <div class="card-body">
              <h5 class="card-title">Nuevas Colecciones</h5>
              <p class="card-text">Descubre las nuevas piezas de este mes.</p>
            </div>
          </div>
        </div>

        <div class="col-md-4 mb-4 d-flex">
          <div class="card h-100" onclick="window.location.href='#artistas'">
            <img src="../img/obras_Inicio/obra_inicio_artistas.jpeg" class="card-img-top" alt="Nuestros Artistas">
            <div class="card-body">
              <h5 class="card-title">Nuestros Artistas</h5>
              <p class="card-text">Conoce mas sobre quienes crean el arte que llevas a casa.</p>
            </div>
          </div>
        </div>

        <div class="col-md-4 mb-4 d-flex">
          <div class="card h-100" onclick="window.location.href='#actualidad'">
            <img src="../img/obras_Inicio/obra_inicio_actualidad.png" class="card-img-top" alt="Actualidad">
            <div class="card-body">
              <h5 class="card-title">Actualidad</h5>
              <p class="card-text">Encuentra noticias sobre lo que ocurre con el arte local.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
