<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/inicio_sesion.css">
    <title>Inicio Sesion</title>
</head>
<body>
    
    <main class="formulario-inicio-sesion">
      
      <div class="cerrar-inicio-sesion">
        <a href="index.html">&times;</a>
      </div>

        <h2>Bienvenidos a Arteria</h2>
      
        <form>
          <input type="email" placeholder="Correo Electrónico" required>
          <input type="password" placeholder="Contraseña" required>

          <p class="olvido-contrasena">
            <a href="#">Olvidé mi contraseña</a>
          </p>
      
          <p class="nota-contra-inicio-sesion">
            La contraseña distingue mayúsculas y minúsculas
          </p>
      
          <button type="submit" class="boton-enviar-inicio-sesion">Iniciar Sesión</button>
      
          <p class="info-inicio-sesion">
            Este sitio está protegido por reCAPTCHA y se aplican la Política de privacidad y los Términos de servicio de Google.  
            <br><br>
          </p>
      
          <p class="no-tiene-cuenta">
            ¿No tienes cuenta? <a href="./registro.html">Registrate</a>
          </p>
        </form>
      </main>

  </body>
  </html>
