<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" >
    <link rel="stylesheet" href="../css/header_footer.css"/>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Roboto&display=swap" >
  </head>

<!-- Top bar -->
<aside class="hdr-top-bar">Anuncios</aside>

<!-- Header principal -->
<header class="container py-1">
  <section class="d-flex justify-content-between align-items-center flex-nowrap flex-md-wrap">

    <!-- Branding -->
    <a href="../html/index.html" class="d-flex align-items-center text-decoration-none text-dark mb-3 mb-md-0">
      <img src="../img/Logo-Arteria/Logo-transparente-light.png" alt="Logo" class="hdr-logo me-2">
      <div>
        <h1 class="h4 m-0">ARTERIA</h1>
        <p class="m-0 small d-none d-md-block">Conectamos el pulso del arte local</p>
      </div>
    </a>

    <!-- Buscador y acciones -->
    <section class="d-flex align-items-center gap-1 hdr-actions">

      <!-- Buscador desktop -->
      <form class="input-group hdr-search d-none d-md-flex" role="search" onsubmit="return false;">
        <button type="submit" class="input-group-text bg-white border-end-0 border" onclick="buscar()" aria-label="Buscar">
          <i class="bi bi-search"></i>
        </button>
        <input type="search" class="form-control border-start-0" placeholder="Buscar arte o artista">
      </form>

      <!-- Botón lupa mobile -->
      <button class="hdr-icon d-md-none" id="hdrMobileSearchToggle" aria-label="Buscar">
        <i class="bi bi-search"></i>
      </button>

       <!-- Buscador mobile (segunda fila) -->
       <div class="hdr-mobile-search d-md-none" id="hdrMobileSearchBar">
        <form class="d-flex w-100" role="search" onsubmit="return false;">
          <input type="search" class="form-control" placeholder="Buscar arte o artista">
          <button type="submit" class="btn btn-link text-dark ms-2"
                  onclick="buscar()" aria-label="Buscar">
            <i class="bi bi-search"></i>
          </button>
        </form>
      </div>

       <!-- Íconos perfil / carrito / hamburguesa -->
       <div class="d-flex gap-1 hdr-icons">

        <!-- Perfil (botón + menú envueltos) -->
        <div class="profile-dropdown">
          <button class="hdr-icon" id="hdrProfileBtn" aria-label="Perfil" aria-expanded="false" type="button">
            <i class="bi bi-person-add"></i>
          </button>

          <!-- Menú (inicialmente oculto) -->
          <nav id="hdrProfileMenu" class="profile-menu" aria-label="Menú de perfil"></nav>
        </div>

        <!-- Carrito -->
        <a href="./carrito.html" class="hdr-icon" aria-label="Carrito">
          <i class="bi bi-bag"></i>
        </a>

        <!-- Hamburguesa -->
        <button class="hdr-icon d-md-none" id="hdrMenuToggle" aria-label="Menú">
          <i class="bi bi-list"></i>
        </button>
      </div>

    </section>
  </section>
</header>

<!-- Barra navegación categorías -->
<nav class="border-bottom bg-white py-2 mt-3">
  <div class="container">
    <ul class="nav nav-underline flex-column flex-md-row gap-3 gap-md-0 justify-content-start" id="hdrMenuCategorias">
      <li class="nav-item"><a class="nav-link active" href="./explorar_cards.html" data-filtro="todos">Explorar</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-filtro="pintura">Pintura</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-filtro="escultura">Escultura</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-filtro="fotografia">Fotografía</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-filtro="ilustracion">Ilustración</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-filtro="artesania">Artesanías</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-filtro="artetextil">Arte Textil</a></li>
    </ul>
  </div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/script.js"></script>
<script src="../js/navbar-profile-menu.js"></script>
</body>
</html>
