<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Administrador de Productos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Roboto&display=swap" >
</head>
<body class="admin-bg">
  <header class="admin-header">
    <a href="index.html" class="admin-logo-container d-flex align-items-center text-decoration-none text-dark">
      <img src="../img/Logo-Arteria/Logo-transparente-light.png" alt="Logo Arteria" class="admin-logo-image" />
      <div class="admin-title-group ms-1">
        <span class="admin-logo-text">ARTERIA</span>
        <span class="admin-header-slogan d-block">Conectamos el pulso del arte local</span>
      </div>
    </a>
  </header>

  <main class="admin-main-content d-flex justify-content-center align-items-start">
    <div class="admin-form-wrapper shadow p-4 rounded-4 bg-white mt-5">
      <h2 class="admin-title mb-4 text-center">Agregar Producto</h2>
      <form id="admin-product-form" class="admin-product-form">
        <div class="admin-form-group mb-3">
          <label for="admin-product-name" class="admin-form-label form-label">Nombre del Producto</label>
          <input type="text"  class="admin-form-control form-control"  id="admin-product-name" placeholder="Ej: Lua + Juliette Painting" required/>
        </div>
        <div class="admin-form-group mb-3">
          <label for="admin-product-img" class="admin-form-label form-label">URL de la Imagen</label>
          <input
            type="url"
            class="admin-form-control form-control"
            id="admin-product-img"
            placeholder="https://..."
            required
          />
        </div>
        <div class="admin-form-group mb-3">
          <label for="admin-product-description" class="admin-form-label form-label">Descripción</label>
          <textarea
            class="admin-form-control form-control"
            id="admin-product-description"
            rows="3"
            placeholder="Ej: Pintura, óleo sobre madera"
            required
          ></textarea>
        </div>
        <button type="submit" class="admin-btn-primary btn btn-primary">Agregar</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="../js/script.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
